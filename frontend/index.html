<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon: the CushLabs chevron mark (brand-mark.md). Conventional names
         stay; bump ?v=N whenever the artwork changes so browsers refetch. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=2"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Build stamp read by scripts/smoke-prod.sh to detect "merged but not
         deployed" drift. Vite substitutes the value at build time. -->
    <meta name="app-version" content="%VITE_APP_VERSION%" />

    <!-- Fonts are self-hosted (public/fonts); preload the latin subsets the
         first paint needs so headings do not swap in late. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://vitals.cushlabs.ai" />

    <!-- Primary Meta Tags -->
    <title>
      AI WebScraper by CushLabs - AI-Powered Site Audits &amp; SEO Analysis
    </title>
    <meta
      name="description"
      content="Crawl websites, detect SEO issues, and generate AI-powered analysis reports. Built for marketing teams and site owners who need actionable website insights."
    />
    <meta name="author" content="CushLabs" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scraper.cushlabs.ai" />
    <meta
      property="og:title"
      content="AI WebScraper by CushLabs — AI-Powered Site Audits"
    />
    <meta
      property="og:description"
      content="Crawl websites, detect SEO issues, and generate AI-powered analysis reports. Built for marketing teams and site owners who need actionable website insights."
    />
    <meta property="og:site_name" content="AI WebScraper" />
    <meta
      property="og:image"
      content="https://scraper.cushlabs.ai/og-image.png?v=2"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AI WebScraper by CushLabs — AI-Powered Site Audits"
    />
    <meta
      name="twitter:description"
      content="Crawl websites, detect SEO issues, and generate AI-powered analysis reports."
    />
    <meta
      name="twitter:image"
      content="https://scraper.cushlabs.ai/og-image.png?v=2"
    />

    <!-- Technical SEO -->
    <link rel="canonical" href="https://scraper.cushlabs.ai" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script
      src="https://vitals.cushlabs.ai/tracker.js"
      data-site="scraper"
      defer
    ></script>
  </body>
</html>
