name: CI

# Pre-publish gate. Nothing merges to main unless the backend suite (unit +
# HTTP smoke via TestClient), the frontend unit tests, the type check and the
# production build all pass. The post-publish gate is production-smoke.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  frontend:
    name: Frontend Tests, Type Check & Build
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Unit tests
        # 35 Vitest specs existed for months without ever running in CI.
        run: |
          cd frontend
          npm test
      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_API_URL: https://api.placeholder.com/api/v1
          REACT_APP_SUPABASE_URL: https://placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: placeholder
          VITE_APP_VERSION: ${{ github.sha }}
