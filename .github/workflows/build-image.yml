name: Build & push image

# Builds the production image in CI and pushes it to GHCR so the shared Hetzner
# box pulls a prebuilt image instead of building on-box. (The image was a ~4 GB
# Playwright base until 2026-10-18; it is python:3.12-slim now.) The deployable
# service lives in ./backend (FastAPI). See cushlabs-prod-server for the compose
# that consumes it. Deploy: docker compose pull webscraper &&
# docker compose up -d webscraper.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rcushmaniii/ai-webscraper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Stamped into APP_VERSION so /api/v1/health/ reports what is
          # running; the production smoke test compares it against main.
          build-args: |
            GIT_SHA=${{ github.sha }}
